name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clear completely unneeded bloat for Jekyll
        run: |
          echo "Removing bloat we definitely don't need for Jekyll..."
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/share/miniconda \
                      /usr/share/az_* \
                      /usr/local/lib/android \
                      /usr/local/lib/node_modules \
                      /usr/local/share/boost \
                      /usr/local/share/chromium \
                      /usr/local/share/powershell \
                      /usr/local/julia* \
                      /usr/local/sqlpackage \
                      /opt/ghc \
                      /opt/az \
                      /opt/pipx \
                      /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/go \
                      /opt/hostedtoolcache/node \
                      /opt/microsoft \
                      /opt/google \
                      "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/heroku \
                      /usr/local/aws-* \
                      /usr/local/bin/aws* \
                      /usr/local/bin/terraform \
                      /usr/local/bin/kubectl
          docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Initial cleanup complete"

      - name: Check disk space and top 20
        run: |
          echo "=== Disk space after initial cleanup ==="
          df -h /
          echo ""
          echo "=== Top 20 space consumers ==="
          sudo du -sh /* 2>/dev/null | sort -hr | head -n 20

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check disk space after checkout
        run: |
          echo "=== Disk space after checkout ==="
          df -h /

      - name: Remove .git to free space
        run: rm -rf .git

      - name: Check disk space after removing .git
        run: |
          echo "=== Disk space after removing .git ==="
          df -h /

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check disk space after build
        run: |
          echo "=== Disk space after build ==="
          df -h /

      - name: Aggressive cleanup (remove Jekyll stuff and everything else)
        run: |
          echo "Aggressive cleanup - nuking everything except _site..."
          # Remove Ruby and all build dependencies
          sudo rm -rf /usr/local/lib/ruby* \
                      /usr/local/libexec \
                      /usr/local/bin/* \
                      /usr/local/share/ri \
                      /usr/local/bundle \
                      /opt/hostedtoolcache
          # Remove docs, fonts, locales, etc
          sudo rm -rf /usr/share/fonts \
                      /usr/share/icons \
                      /usr/share/locale \
                      /usr/share/man \
                      /usr/share/doc \
                      /usr/share/info
          # Remove logs and cache
          sudo rm -rf /var/log/*log \
                      /var/cache/* \
                      /tmp/*
          # Remove source files - keep ONLY _site directory
          cd /home/runner/work/soundgasm.net-jerkyll-mirror/soundgasm.net-jerkyll-mirror
          find . -maxdepth 1 -not -name '_site' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          echo "Aggressive cleanup complete"

      - name: Check disk space after aggressive cleanup
        run: |
          echo "=== Disk space after aggressive cleanup ==="
          df -h /
          echo ""
          echo "=== Top 20 remaining space consumers ==="
          sudo du -sh /* 2>/dev/null | sort -hr | head -n 20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4